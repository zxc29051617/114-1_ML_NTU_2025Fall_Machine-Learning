# 1. 實驗名稱 
name: "problem1_unet_bce"

# 2. 模型 
model:
  name: "SimpleCNNUNet"   
  args:                  
    in_channels: 1
    out_channels: 1

# 3. 資料轉換 
transform:
  resized_imaged:
    size: [448, 576]

# 4. 資料集 
train_dataset:
  data_dir: dataset/train
  has_label: true
valid_dataset:
  data_dir: dataset/train
  has_label: true

# 5. 資料載入器 
train_loader:
  batch_size: 4
  num_workers: 4
  shuffle: true
valid_loader:
  batch_size: 1
  num_workers: 1
  shuffle: false

# 6. 損失函數 
criterion:
  name: "BCELoss"   
  args: {} 

# 7. 評估指標 
eval_func:
  name: "DiceScore"  
  args:              
    smooth: 1e-5

# 8. 優化器
optimizer:
  name: "AdamW"     
  args:
    lr: 0.0001
    weight_decay: 0.01

# 9. 學習率排程器 
lr_scheduler:
  name: "CosineAnnealingLR" 
  args:
    T_max: 100 
    eta_min: 1e-6

# 10. 訓練器 
trainer:
  n_epoch: 100
  accumulation_steps: 4
  
# 11. 儲存點
checkpoint:
  path: "problem1_unet_bce_best.pth"