name: cnn_unet
transform:
  resized_imaged:
    size: [448, 576]
train_dataset:
  data_dir: dataset/train
  has_label: true
valid_dataset:
  data_dir: dataset/train
  has_label: true
train_loader:
  batch_size: 16
  num_workers: 4
  shuffle: true
valid_loader:
  batch_size: 1
  num_workers: 1
  shuffle: false
optimizer:
  lr: 0.0001
trainer:
  n_epoch: 100
checkpoint:
  path: problem1_unet_bce_aug_best.pth
